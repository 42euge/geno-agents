[project]
name = "geno-agents"
version = "0.1.0"
description = "Agent coordination layer — registration, discovery, and role management"
requires-python = ">=3.10"
dependencies = ["click>=8.0"]

[project.scripts]
geno-agents = "geno_agents.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geno_agents*"]
