[project]
name = "geno-agents"
version = "0.4.0"
description = "Agent coordination layer — registration, discovery, role management, and execution/tracking runner"
requires-python = ">=3.10"
dependencies = ["click>=8.0"]

[project.scripts]
geno-agents = "geno_agents.cli:main"
geno-agent = "geno_agents.runner:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geno_agents*"]
